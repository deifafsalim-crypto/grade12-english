<body>
  <div id="__bundler_placeholder">Loading الرئيسية – Retail Therapy...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

.t-peach{--tone:#f3d2b8;--toneInk:#9a5a30;--toneSoft:var(--peach-soft)}\n.t-sage{--tone:#c6ddc7;--toneInk:#3e7351;--toneSoft:var(--sage-soft)}\n.t-rose{--tone:#f1cdd5;--toneInk:#a04a62;--toneSoft:var(--rose-soft)}\n.t-butter{--tone:#f3e1a8;--toneInk:#8a6a14;--toneSoft:var(--butter-soft)}\n.t-sky{--tone:#c4dbee;--toneInk:#36658f;--toneSoft:var(--sky-soft)}\n.t-lavender{--tone:#d9ceee;--toneInk:#664c9a;--toneSoft:var(--lavender-soft)}\n.t-mint{--tone:#c7e6db;--toneInk:#2f7862;--toneSoft:var(--mint-soft)}\n\n/* base */\n*{box-sizing:border-box;margin:0;padding:0}\nbody{background:var(--bg);color:var(--ink);font-family:\"Baloo Bhaijaan 2\",\"Segoe UI\",Tahoma,\"Noto Sans Arabic\",sans-serif;font-size:18px;line-height:1.65;\n  background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:26px 26px}\nbutton{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}\nimg{max-width:100%;display:block}\n.en{direction:ltr;unicode-bidi:isolate;font-family:\"Baloo Bhaijaan 2\",\"Segoe UI\",Tahoma,\"Noto Sans Arabic\",sans-serif}\na:focus-visible,button:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:4px}\n.wrap{max-width:1040px;margin:0 auto;padding:22px 16px 80px}\n\n/* nav */\n.nav{position:sticky;top:0;z-index:20;display:flex;justify-content:center;padding:12px 12px 0}\n.nav-in{display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--paper) 82%,transparent);\n  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);outline:1px solid var(--line)}\n.nav a,.nav button{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-weight:600;font-size:15px;color:var(--ink);text-decoration:none;transition:background .4s cubic-bezier(.32,.72,0,1),transform .3s cubic-bezier(.32,.72,0,1)}\n.nav a:active,.nav button:active{transform:scale(.96)}\n.nav a.on{background:var(--ink);color:var(--paper)}\n.nav .brand{font-weight:800}\n\n/* double bezel */\n.shell{background:var(--shell);outline:1px solid var(--line);padding:6px;border-radius:30px}\n.core{background:var(--card);border-radius:24px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.5);overflow:hidden}\n.pad{padding:22px}\n.core.pad-hero{padding:30px}\na.shell{display:block;text-decoration:none;color:inherit}\n\n/* reveal */\n.rv{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.32,.72,0,1),transform .8s cubic-bezier(.32,.72,0,1)}\n.rv.in{opacity:1;transform:none}\n@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}\n\n/* hero */\n.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:stretch;margin-top:10px}\n.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.1;font-weight:800;letter-spacing:-.5px}\n.hero p{color:var(--muted);font-size:19px;margin-top:10px;max-width:34ch}\n.hero .core.pad-hero{height:100%;display:flex;flex-direction:column;justify-content:center}\n.team{background:linear-gradient(160deg,var(--toneSoft),var(--card));display:grid;place-items:center;padding:20px;height:100%}\n.team img{width:min(440px,100%);filter:drop-shadow(0 16px 20px rgba(0,0,0,.12))}\n\n/* pill, stats, cta */\n.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;background:var(--toneSoft);color:var(--toneInk)}\n.stats{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}\n.stat{background:var(--toneSoft);border-radius:18px;padding:8px 16px;font-weight:700;color:var(--toneInk)}\n.stat small{display:block;font-weight:500;font-size:13px;color:var(--muted)}\n.cta{text-decoration:none;display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:8px 8px 8px 20px;padding-inline-start:22px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:700;width:max-content;transition:transform .4s cubic-bezier(. lor:var(--toneInk);font-weight:700}\n.tabs{display:flex;gap:6px;overflow-x:auto;margin:18px 0 6px;padding:4px;scrollbar-width:none}\n.tabs::-webkit-scrollbar{display:none}\n.tabs a{flex:none;padding:8px 18px;border-radius:999px;background:var(--card);outline:1px solid var(--line);font-weight:700;text-decoration:none;color:var(--ink);transition:all .4s cubic-bezier(.32,.72,0,1)}\n.tabs a.on{background:var(--tone);color:var(--toneInk);outline-color:transparent}\n.block{margin-top:22px}\n.block h3{font-size:22px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px}\n.block h3 .dot{width:12px;height:12px;border-radius:4px;background:var(--tone)}\n.lead{color:var(--muted)}\n.goal{background:var(--toneSoft);border-radius:20px;padding:14px 18px;font-weight:600;color:var(--toneInk)}\n.value{margin-top:12px;background:var(--toneSoft);border-radius:16px;padding:10px 16px;color:var(--toneInk);font-weight:700}\n\n/* vocab */\n.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}\n.vcard{background:var(--paper);border-radius:22px;padding:8px;outline:1px solid var(--line);text-align:center;transition:transform .4s cubic-bezier(.32,.72,0,1),box-shadow .4s cubic-bezier(.32,.72,0,1)}\n.vcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}\n.vcard:active{transform:scale(.97)}\n.vcard .vis{width:100%;aspect-ratio:1.08;border-radius:16px;object-fit:cover}\n.vis.num,.vis.emo{display:grid;place-items:center;background:var(--toneSoft);color:var(--toneInk);font-weight:800;font-size:54px;border-radius:16px;width:100%;aspect-ratio:1.08}\n.vis.num.small{font-size:42px}\n.vcard b{display:block;font-size:17px;margin-top:6px;line-height:1.3}\n.vcard span.ar{display:block;color:var(--muted);font-size:15px}\n.spk{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--toneSoft);color:var(--toneInk);font-size:15px;flex:none;transition:transform .3s cubic-bezier(.32,.72,0,1)}\n.spk:active{transform:scale(.9)}\n\n/* grammar */\n.gcard{background:var(--paper);border-radius:22px;padding:16px 18px;outline:1px solid var(--line);margin-top:12px}\n.gcard h4{font-size:19px;font-weight:800;color:var(--toneInk)}\n.ex{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;margin-top:6px;background:var(--card);cursor:pointer;transition:background .3s cubic-bezier(.32,.72,0,1)}\n.ex:hover{background:var(--toneSoft)}\n.ex .en{font-weight:700;flex:1;text-align:left}\n.ex .ar{color:var(--muted);font-size:15px;flex:1}\n@media(max-width:620px){.ex{flex-wrap:wrap}.ex .ar{flex-basis:100%;padding-inline-start:44px}}\n\n/* phonics */\n.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}\n.chip{padding:6px 14px;border-radius:999px;background:var(--toneSoft);color:var(--toneInk);font-weight:700;direction:ltr}\n.chip u{text-decoration:none;background:var(--tone);border-radius:6px;padding:0 3px}\n.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;margin-top:10px}\n.alpha button{aspect-ratio:1;border-radius:16px;background:var(--toneSoft);color:var(--toneInk);font-weight:800;font-size:22px;direction:ltr;transition:transform .3s cubic-bezier(.32,.72,0,1)}\n.alpha button:active{transform:scale(.9)}\n.culture{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start;margin-top:10px}\n.culture img{border-radius:18px;cursor:zoom-in;outline:1px solid var(--line)}\n\n/* story */\n.pages{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}\n.pages img{border-radius:18px;cursor:zoom-in;outline:1px solid var(--line)}\n.pages.one{grid-template-columns:minmax(0,560px)}\n.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}\n.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;background:var(--tone);color:var(--toneInk);font-weight:700;text-decoration:none;transition:transform .35s cubic-bezier(.32,.72,0,1)}\n.btn.ghost{background:var(--card);out l-highlight:inset 0 1px 0 rgba(255,255,255,.5);\n  --container:1040px;--touch-min:46px;--control-min:48px;--speak:34px;--game-icon:64px;--bigplay:110px;\n  --blur-nav:14px;--blur-modal:18px;--blur-dialog:6px;--z-nav:20;--z-confetti:30;--z-modal:40;\n  --spring:cubic-bezier(.32,.72,0,1);\n}\n@media (prefers-color-scheme:dark){\n  :root:not([data-theme=\"light\"]){--bg:#1f1e27;--paper:#24232d;--card:#2b2a35;--ink:#ede9f3;--muted:#a6a3b5;--line:rgba(255,255,255,.07);--shell:rgba(255,255,255,.035);--okbg:#23392e;--nobg:#3e2a26;--toneSoft:#302e3a;--rose-soft:#302e3a;--sage-soft:#302e3a;--sky-soft:#302e3a;--butter-soft:#302e3a;--lavender-soft:#302e3a;--mint-soft:#302e3a;--peach-soft:#302e3a;--focus:var(--ink);--shadow:0 18px 40px -22px rgba(0,0,0,.6)}\n}\n:root[data-theme=\"dark\"]{--bg:#1f1e27;--paper:#24232d;--card:#2b2a35;--ink:#ede9f3;--muted:#a6a3b5;--line:rgba(255,255,255,.07);--shell:rgba(255,255,255,.035);--okbg:#23392e;--nobg:#3e2a26;--toneSoft:#302e3a;--rose-soft:#302e3a;--focus:var(--ink);--shadow:0 18px 40px -22px rgba(0,0,0,.6)}\n\nhtml,body{background:var(--bg)}\nbody{margin:0}\n@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}\n@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}\n\n.nav-in{flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}\n.nav-in a{min-height:40px}\n.lead{color:var(--muted);font-size:19px;margin-top:10px}\n.sub{color:var(--muted);font-size:15px}\n.mt{margin-top:22px}\n.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}\n\n/* bilingual pair */\n.bi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}\n.bi > div{background:var(--paper);outline:1px solid var(--line);border-radius:22px;padding:14px 18px}\n.bi .enp{direction:ltr;text-align:left}\n.bi h4{font-size:17px;font-weight:800;color:var(--toneInk);margin-bottom:4px}\n@media (max-width:720px){.bi{grid-template-columns:1fr}}\n\n/* word cards */\n.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}\n.wcard{background:var(--paper);outline:1px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-align:start;transition:transform .4s cubic-bezier(.32,.72,0,1),box-shadow .4s cubic-bezier(.32,.72,0,1)}\n.wcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}\n.wcard .top{display:flex;align-items:center;justify-content:space-between;gap:8px}\n.wcard .w{font-size:21px;font-weight:800;direction:ltr}\n.wcard .pos{font-size:13px;color:var(--toneInk);background:var(--toneSoft);border-radius:999px;padding:0 10px;direction:ltr;font-weight:600}\n.wcard .ar{font-weight:700;font-size:17px}\n.wcard .def{direction:ltr;text-align:left;font-size:15px;color:var(--muted);line-height:1.45}\n.wcard .exs{direction:ltr;text-align:left;font-size:15px;background:var(--toneSoft);border-radius:14px;padding:6px 10px;line-height:1.45}\n.hot{font-size:12px;font-weight:700;color:var(--toneInk);background:var(--tone);border-radius:999px;padding:0 8px}\n.spk{width:34px;height:34px;min-width:34px;border-radius:50%;background:var(--toneSoft);display:grid;place-items:center;font-size:16px}\n\n/* game & exam */\n.qcard{max-width:760px;margin:0 auto}\n.opt{width:100%;text-align:center;color:var(--ink)}\n.opt.en-opt{direction:ltr}\n.why{margin-top:6px;line-height:1.8;white-space:pre-line}\n.fbbox{border-radius:20px;padding:12px 16px;margin-top:14px;text-align:start}\n.fbbox.ok{background:var(--okbg)}\n.fbbox.no{background:var(--nobg)}\n.fbbox b{font-size:19px}\n.prog{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}\n.prog i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}\n.prog i.ok{background:#6fae8c}.prog i.no{background:#e08e7b}.prog i.cur{background:var(--tone)}\n.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px}\n.mode{background:var(--paper);outline:2px solid var(--line);border-radius:22px;padding:14px 16px;text-align:start;color:var(--ink);transition:transform .35s cubic-bezier(.32,.72,0,1),outline-color .3s}\n.mode:hover{outline-color:var(--tone);transform:translateY(-3px)}\n.mode.on{outline-color:var(--toneInk);background:var(--toneSoft)}\n.mode .ic{font-size:30px}\n.mode h4{font-size:19px;font-weight:800}\n.mode p{font-size:14px;color:var(--muted);line-height:1.5}\n\n/* grammar */\n.formula{direction:ltr;text-align:center;font-weight:800;font-size:clamp(18px,3vw,24px);background:var(--toneSoft);color:var(--toneInk);border-radius:20px;padding:14px;margin-top:10px}\n.gtable{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:8px}\n.gtable th{font-size:14px;color:var(--toneInk);text-align:start;padding:4px 10px}\n.gtable td{background:var(--card);padding:8px 10px;font-size:16px}\n.gtable td:first-child{border-radius:0 14px 14px 0}\n.gtable td:last-child{border-radius:14px 0 0 14px}\n.tscroll{overflow-x:auto}\n.warn{background:var(--nobg);border-radius:20px;padding:12px 16px;margin-top:12px}\n.good{background:var(--okbg);border-radius:20px;padding:12px 16px;margin-top:12px}\n\n/* writing */\n.essay{direction:ltr;text-align:left;background:var(--paper);outline:1px solid var(--line);border-radius:22px;padding:18px 20px;margin-top:12px;line-height:1.75}\n.essay h5{font-size:15px;font-weight:800;color:var(--toneInk);margin-top:10px}\n.essay h5:first-child{margin-top:0}\n.essay p{font-size:17px}\n.essay mark{background:var(--tone);color:var(--ink);border-radius:6px;padding:0 4px;font-weight:700}\n.essay .t{font-weight:800;font-size:19px;text-align:center;margin-bottom:6px}\n.wc{font-size:13px;color:var(--toneInk);background:var(--toneSoft);border-radius:999px;padding:2px 10px;display:inline-block;direction:ltr}\n.outline{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}\n.outline > div{background:var(--paper);outline:1px solid var(--line);border-radius:18px;padding:12px 14px}\n.outline b{display:block;color:var(--toneInk)}\n.outline .en{display:block;font-weight:700;font-size:15px}\n.ideas{background:var(--toneSoft);border-radius:20px;padding:12px 16px;margin-top:12px}\n\n/* exam */\n.passage{direction:ltr;text-align:left;background:var(--paper);outline:1px solid var(--line);border-radius:22px;padding:18px 20px;line-height:2;font-size:18px;margin-top:12px}\n.passage b{background:var(--toneSoft);color:var(--toneInk);border-radius:6px;padding:0 6px}\n.eq{background:var(--paper);outline:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-top:12px}\n.eq .qt{font-weight:700;direction:ltr;text-align:left;font-size:18px}\n.eopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;direction:ltr}\n.eopt{background:var(--card);outline:2px solid var(--line);border-radius:16px;padding:8px 10px;font-weight:700;font-size:17px;color:var(--ink);min-height:46px;transition:outline-color .3s,background .3s}\n.eopt:hover{outline-color:var(--tone)}\n.eopt.sel{outline-color:var(--toneInk);background:var(--toneSoft)}\n.eopt.ok{background:var(--okbg);outline-color:#6fae8c}\n.eopt.no{background:var(--nobg);outline-color:#e08e7b}\n@media (max-width:620px){.eopts{grid-template-columns:1fr}}\n.scorebar{position:sticky;bottom:12px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(14px);outline:1px solid var(--line);box-shadow:var(--shadow);border-radius:999px;padding:8px 8px 8px 18px}\n.btn.ink{background:var(--ink);color:var(--paper)}\n\n/* tap-a-word translation sheet */\n.en,.passage,.essay,.txt,.qt,.q,.exs,.def{cursor:help}\n.wpop{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;min-width:min(420px,calc(100vw - 32px));max-width:calc(100vw - 32px);background:var(--paper);outline:1px solid var(--line);box-shadow:0 20px 50px -18px rgba(40,30,20,.45);border-radius:22px;padding:12px 14px;animation:pop .4s cubic-bezier(.32,.72,0,1)}\n.wpop .wtxt{flex:1;display:flex;flex-direction:column;line-height:1.35}\n.wpop .wtxt b{font-size:22px;font-weight:800;direction:ltr;text-align:left}\n.wpop .wtxt span{font-size:18px;font-weight:700;color:var(--toneInk)}\n.wpop .wtxt small{font-size:13px;color:var(--muted)}\n.wpop .spk{width:46px;height:46px;min-width:46px;font-size:20px}\n.wpop .x{width:44px;height:44px;border-radius:50%;background:var(--card);outline:1px solid var(--line);font-size:16px}\n.tapnote{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--toneInk);background:var(--toneSoft);border-radius:999px;padding:4px 12px}\n\n/* games */\n.gmenu{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:16px}\n.gbtn{background:var(--paper);outline:2px solid var(--line);border-radius:22px;padding:16px;text-align:start;color:var(--ink);display:flex;flex-direction:column;gap:6px;transition:transform .35s cubic-bezier(.32,.72,0,1),outline-color .3s,box-shadow .3s}\n.gbtn:hover{transform:translateY(-4px);outline-color:var(--tone);box-shadow:var(--shadow)}\n.gbtn .gi{font-size:30px;width:56px;height:56px;border-radius:18px;background:var(--toneSoft);display:grid;place-items:center}\n.gbtn h4{font-size:19px;font-weight:800;line-height:1.3}\n.gbtn p{font-size:14px;color:var(--muted);line-height:1.5}\n.gbtn .cat{font-size:12px;font-weight:700;color:var(--toneInk);background:var(--toneSoft);border-radius:999px;padding:1px 10px;width:max-content}\n.lvl{font-size:12px;color:var(--muted)}\n.toks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr;margin-top:18px}\n.tok{background:var(--paper);outline:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:19px;font-weight:700;color:var(--ink);min-height:46px}\n.tok:hover{outline-color:var(--tone)}\n.tok.ok{background:var(--okbg);outline-color:#6fae8c}\n.tok.no{background:var(--nobg);outline-color:#e08e7b;animation:shake .45s cubic-bezier(.32,.72,0,1)}\n.built{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr;padding:12px;border-radius:18px;background:var(--toneSoft);outline:2px dashed var(--tone);margin-top:16px}\n.built span{background:var(--card);border-radius:12px;padding:6px 12px;font-weight:700;font-size:18px;box-shadow:var(--shadow)}\n.built.sent span{font-size:16px;font-weight:600;text-align:left;width:100%}\n.tiles2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr;margin-top:14px}\n.tiles2 button{background:var(--card);box-shadow:var(--shadow);outline:1px solid var(--line);border-radius:14px;padding:8px 14px;font-size:18px;font-weight:700;color:var(--ink);min-height:46px;transition:opacity .3s,transform .3s cubic-bezier(.32,.72,0,1)}\n.tiles2 button.used{opacity:.2;pointer-events:none}\n.tiles2.sent button{font-size:15px;font-weight:600;text-align:left;width:100%}\n.tin{width:100%;max-width:420px;display:block;margin:18px auto 0;direction:ltr;text-align:center;font:inherit;font-size:24px;font-weight:700;padding:10px 14px;border-radius:16px;border:0;outline:2px solid var(--tone);background:var(--paper);color:var(--ink)}\n.opt.gone{opacity:.15;pointer-events:none}\n.flashbox{direction:ltr;text-align:left;background:var(--toneSoft);border-radius:18px;padding:14px 16px;margin-top:12px;font-size:17px;line-height:1.7}\n.life{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}\n.life button{border-radius:999px;padding:6px 14px;font-weight:700;background:var(--toneSoft);color:var(--toneInk);min-height:40px}\n.life button.usedl{opacity:.35;pointer-events:none}\n.timer{font-weight:800;color:var(--toneInk);background:var(--tone);border-radius:999px;padding:2px 12px}\n.speedfb{text-align:center;font-weight:700;margin-top:10px;min-height:28px}\ntextarea.wbox{width:100%;min-height:260px;direction:ltr;text-align:left;font:inherit;font-size:17px;line-height:1.7;padding:14px 16px;border-radius:18px;border:0;outline:2px solid var(--tone);background:var(--paper);color:var(--ink);margin-top:10px}\n.check{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:12px}\n.check div{border-radius:14px;padding:8px 12px;font-weight:600;font-size:15px}\n.check .y{background:var(--okbg)}.check .n{background:var(--nobg)}\n.sinput{direction:ltr;font:inherit;font-size:17px;font-weight:600;padding:8px 12px;border-radius:14px;border:0;outline:2px solid var(--line);background:var(--card);color:var(--ink);width:100%;max-width:360px;margin-top:10px}\n.sinput.ok{outline-color:#6fae8c;background:var(--okbg)}.sinput.no{outline-color:#e08e7b;background:var(--nobg)}\n.foot{text-align:center;color:var(--muted);font-size:14px;margin-top:44px}\n<\u002Fstyle>\n<script src=\"7bac0271-9a93-42a8-a8c9-8c9156136fa4\"><\u002Fscript>\n<meta name=\"hz:slide-selector\" content=\"[data-canvas-width]\"><meta name=\"hz:canvas-width\" content=\"1280\"><meta name=\"hz:canvas-height\" content=\"2300\"><\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\nbody{margin:0}\na{color:#a04a62}a:hover{color:#7d3449}\n.maptile{display:block;text-decoration:none;color:var(--ink)}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"t-rose\" dir=\"rtl\" lang=\"ar\" sc-camel-on-click=\"{{tapWord}}\" style=\"min-height: 100vh; background: var(--bg); background-image: radial-gradient(var(--line) 1.2px, transparent 1.2px); background-size: 26px 26px; font-family: &quot;Baloo Bhaijaan 2&quot;,&quot;Segoe UI&quot;,Tahoma,&quot;Noto Sans Arabic&quot;,sans-serif; color: var(--ink);\" data-canvas-width=\"1280\" data-canvas-height=\"2300\" data-document-role=\"page\" data-label=\"الرئيسية · Home\">\n<nav class=\"nav\" aria-label=\"أقسام المنصة\">\n  <div class=\"nav-in\">\n    <a class=\"brand\" href=\"Main.dc.html\">🤖 نادي أتومك<\u002Fa>\n    <a class=\"on\" href=\"Main.dc.html\">الرئيسية<\u002Fa>\n    <a href=\"Book.dc.html\">شرح الكتاب<\u002Fa>\n    <a href=\"Vocab.dc.html\">🎮 الكلمات والألعاب<\u002Fa>\n    <a href=\"Grammar.dc.html\">القواعد<\u002Fa>\n    <a href=\"Writing.dc.html\">الكتابة<\u002Fa>\n    <a href=\"Games.dc.html\">تحديات المهارات<\u002Fa>\n    <a href=\"Exam.dc.html\">🏆 الاختبارات<\u002Fa>\n    <a href=\"T2Book.dc.html\">📗 الثيم 2<\u002Fa>\n    <a href=\"T3Book.dc.html\">📗 الثيم 3<\u002Fa>\n    <a href=\"T4Book.dc.html\">📗 الثيم 4<\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n<main class=\"wrap\">\n  <div class=\"hero\">\n    <div class=\"shell\"><div class=\"core pad-hero\" style=\"padding: 30px; height: 100%; display: flex; flex-direction: column; justify-content: center;\">\n      <span class=\"pill\" style=\"width: max-content;\">الصف الثاني عشر · الفصل الأول · الثيم الأول<\u002Fspan>\n      <h1 style=\"margin-top: 10px;\">التسوق والتجارة<\u002Fh1>\n      <span class=\"en\" style=\"display: block; font-size: 24px; font-weight: 800; color: var(--toneInk);\">Theme 1 · Retail Therapy<\u002Fspan>\n      <p class=\"lead\">كل الثيم الأول في مكان واحد: شرح الكتاب وحدة وحدة مع إجابات الأنشطة، الكلمات بالعربي والإنجليزي، ألعاب تشرح لك خطأك، القواعد، الكتابة، واختبار بنمط وزاري.<\u002Fp>\n      <div class=\"stats\">\n        <div class=\"stat\">5<small>وحدات مشروحة<\u002Fsmall><\u002Fdiv>\n        <div class=\"stat\">130+<small>كلمة<\u002Fsmall><\u002Fdiv>\n        <div class=\"stat\">15<small>لعبة تفكير<\u002Fsmall><\u002Fdiv>\n        <div class=\"stat\">5<small>اختبارات مهارات<\u002Fsmall><\u002Fdiv>\n      <\u002Fdiv>\n      <span class=\"tapnote\" style=\"margin-top: 12px; width: max-content; max-width: 100%;\">💡 اضغط على أي كلمة إنجليزية في المنصة لتسمعها وترى معناها بالعربي<\u002Fspan>\n      <a class=\"cta\" href=\"Book.dc.html\">ابدأ بشرح الكتاب <i>←<\u002Fi><\u002Fa>\n    <\u002Fdiv><\u002Fdiv>\n    <div class=\"shell\"><div class=\"core\" style=\"height: 100%; background: linear-gradient(160deg, var(--toneSoft), var(--card)); padding: 26px; display: flex; flex-direction: column; justify-content: center; gap: 12px;\">\n      <h2 style=\"font-size: 22px; font-weight: 800;\">عن ماذا يتحدث الثيم؟<\u002Fh2>\n      <p style=\"font-size: 16px;\"><span class=\"en\">Retail therapy<\u002Fspan> تعني «التسوق لتحسين المزاج». يتحدث الثيم عن <b>التجارة عبر التاريخ، العلامات التجارية، إدمان التسوق، المولات والأسواق، والإعلانات<\u002Fb>.<\u002Fp>\n      <p class=\"en\" style=\"display: block; text-align: left; font-size: 16px; color: var(--muted);\">Retail therapy means buying things to make yourself feel better. The theme covers trade through history, brand names, shopaholics, malls and souqs, and advertising.<\u002Fp>\n    <\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <section class=\"block\">\n    <h3><span class=\"dot\"><\u002Fspan>تفصيل الثيم · <span class=\"en\">Theme 1 at a glance<\u002Fspan><\u002Fh3>\n    <p class=\"sub\">كل وحدة لها مهارة رئيسية في الكتاب. اضغط على الوحدة لترى شرحها وإجابات أنشطتها.<\u002Fp>\n    <div class=\"ggrid\">\n      <a class=\"shell gtile maptile\" href=\"Book.dc.html\"><div class=\"core pad\"><span class=\"pill\">Unit 1 · Reading<\u002Fspan><h4 class=\"en\" style=\"text-align: left;\">A Fair Exchange<\u002Fh4><p>التجارة قديمًا وحديثًا: الداو واللبان والنفط. مهارة القراءة السريعة <span class=\"en\">skimming<\u002Fspan> والجملة الرئيسية.<\u002Fp><\u002Fdiv><\u002Fa>\n      <a class=\"shell gtile maptile\" href=\"Book.dc.html\"><div class=\"core pad\"><span class=\"pill\">Unit 2 · Grammar<\u002Fspan><h4 class=\"en\" style=\"text-align: left;\">What's in a Name?<\u002Fh4><p>تاريخ العلامات التجارية (أديداس، كوكاكولا، الطيران العُماني). قاعدة الماضي البسيط والمبني للمجهول.<\u002Fp><\u002Fdiv><\u002Fa>\n      <a class=\"shell gtile maptile\" href=\"Book.dc.html\"><div class=\"core pad\"><span class=\"pill\">Unit 3 · Vocabulary<\u002Fspan><h4 class=\"en\" style=\"text-align: left;\">Shop Till You Drop<\u002Fh4><p>مدمنو التسوق. تخمين المعنى من السياق و <span class=\"en\">collocations<\u002Fspan> مع <span class=\"en\">make / do<\u002Fspan>.<\u002Fp><\u002Fdiv><\u002Fa>\n      <a class=\"shell gtile maptile\" href=\"Book.dc.html\"><div class=\"core pad\"><span class=\"pill\">Unit 4 · Listening &amp; Speaking<\u002Fspan><h4 class=\"en\" style=\"text-align: left;\">Malls and Markets<\u002Fh4><p>المول أم السوق؟ التوقّع قبل الاستماع، والتعبير عن الإعجاب والكره والتفضيل.<\u002Fp><\u002Fdiv><\u002Fa>\n      <a class=\"shell gtile maptile\" href=\"Book.dc.html\"><div class=\"core pad\"><span class=\"pill\">Unit 5 · Writing<\u002Fspan><h4 class=\"en\" style=\"text-align: left;\">Adverts – Appealing or Appalling?<\u002Fh4><p>الشعارات وكلمات وصف المنتجات والإعلانات المضللة. كتابة تقييم إعلان.<\u002Fp><\u002Fdiv><\u002Fa>\n      <a class=\"shell gtile maptile\" href=\"Book.dc.html\"><div class=\"core pad\"><span class=\"pill\">Across Cultures · Reading for Pleasure<\u002Fspan><h4>مصر · الأخلاق والإعلان<\u002Fh4><p>معلومات عن مصر ومقارنتها بعُمان، ومقال عن الإعلانات غير الأخلاقية.<\u002Fp><\u002Fdiv><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"block t-sky\">\n    <h3><span class=\"dot\"><\u002Fspan>📗 الثيم الثاني · <span class=\"en\">Theme 2 – Starting University<\u002Fspan> (جديد)<\u002Fh3>\n    <p class=\"sub\">ترك المدرسة والاستعداد للجامعة، الدراسة في الخارج، الجوالة وطلب التوضيح، ورسالة لمعلمك الجديد. القاعدة: الماضي التام + I wish + الكلام المنقول.<\u002Fp>\n    <div class=\"ggrid\">\n      <a class=\"shell gtile maptile\" href=\"T2Book.dc.html\"><div class=\"core pad\"><div class=\"ic\">📘<\u002Fdiv><h4>شرح الثيم 2<\u002Fh4><p>المقدمة والوحدات الخمس وفرنسا ورميثة والمراجعة، مع إجابات كتاب النشاط وحلول أوراق العمل.<\u002Fp><\u002Fdiv><\u002Fa>\n      <a class=\"shell gtile maptile\" href=\"T2Vocab.dc.html\"><div class=\"core pad\"><div class=\"ic\">🔤<\u002Fdiv><h4>كلمات وألعاب الثيم 2<\u002Fh4><p>كلمات كل وحدة بمعانيها، 15 لعبة حفظ، وأسئلة وزارية على الكلمات المتكررة.<\u002Fp><\u002Fdiv><\u002Fa>\n      <a class=\"shell gtile maptile\" href=\"T2Grammar.dc.html\"><div class=\"core pad\"><div class=\"ic\">🧩<\u002Fdiv><h4>قواعد الثيم 2<\u002Fh4><p>10 دروس: الماضي التام، I wish، الكلام والسؤال المنقول، أنماط الأفعال، الترقيم، مع 62 سؤالًا تحت الشرح.<\u002Fp><\u002Fdiv><\u002Fa>\n      <a class=\"shell gtile maptile\" href=\"T2Writing.dc.html\"><div class=\"core pad\"><div class=\"ic\">📝<\u002Fdiv><h4>كتابة الثيم 2<\u002Fh4><p>قالب رسالة المعلم، 3 رسائل جاهزة و4 نصوص أخرى بالترجمة وقائمة الكلمات.<\u002Fp><\u002Fdiv><\u002Fa>\n      <a class=\"shell gtile maptile\" href=\"T2Exam.dc.html\"><div class=\"core pad\"><div class=\"ic\">🏆<\u002Fdiv><h4>اختبارات الثيم 2<\u002Fh4><p>قراءة، قواعد، مفردات، استماع بصوت، كتابة مع مصحّح للرسالة، ونمط وزاري من أوراقك.<\u002Fp><\u002Fdiv><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"block t-mint\">\n    <h3><span class=\"dot\"><\u002Fspan>📗 الثيم الثالث · <span class=\"en\">Theme 3 – Tourism and Hospitality<\u002Fspan> (جديد)<\u002Fh3>\n    <p class=\"sub\">لماذا يحب السياح عُمان، وظائف الضيافة، أشهر الوجهات، الشكوى والرد عليها، والمقال القصصي عن وجبة. القاعدة: الشرط الأول والشرط مع الأفعال الناقصة.<\u002Fp>\n    <div class=\"ggrid\">\n      <a class=\"shell gtile maptile\" href=\"T3Book.dc.html\"><div class=\"core pad\"><div class=\"ic\">📘<\u002Fdiv><h4>شرح الثيم 3<\u002Fh4><p>الوحدات الخمس وكندا وعيسى اللمكي والمراجعة، مع إجابات كتاب النشاط وملحقاته.<\u002Fp><\u002Fdiv><\u002Fa>\n      <a class=\"shell gtile maptile\" href=\"T3Vocab.dc.html\"><div class=\"core pad\"><div class=\"ic\">🔤<\u002Fdiv><h4>كلمات وألعاب الثيم 3<\u002Fh4><p>كلمات كل وحدة بمعانيها، 15 لعبة حفظ، وأسئلة وزارية مع تعليل كل إجابة.<\u002Fp><\u002Fdiv><\u002Fa>\n      <a class=\"shell gtile maptile\" href=\"T3Grammar.dc.html\"><div class=\"core pad\"><div class=\"ic\">🧩<\u002Fdiv><h4>قواعد الثيم 3<\u002Fh4><p>9 دروس: الشرط الأول، الأفعال الناقصة، unless، أفعال الحالة، -ed/-ing، أزمنة القصة، وتنظيم المقال.<\u002Fp><\u002Fdiv><\u002Fa>\n      <a class=\"shell gtile maptile\" href=\"T3Writing.dc.html\"><div class=\"core pad\"><div class=\"ic\">📝<\u002Fdiv><h4>كتابة الثيم 3<\u002Fh4><p>قالب المقال القصصي و5 مقالات جاهزة بالترجمة وقائمة الكلمات.<\u002Fp><\u002Fdiv><\u002Fa>\n      <a class=\"shell gtile maptile\" href=\"T3Exam.dc.html\"><div class=\"core pad\"><div class=\"ic\">🏆<\u002Fdiv><h4>اختبارات الثيم 3<\u002Fh4><p>قراءة، قواعد، مفردات، استماع بصوت، كتابة مع مصحّح للمقال القصصي، ونمط وزاري.<\u002Fp><\u002Fdiv><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"block t-lavender\">\n    <h3><span class=\"dot\"><\u002Fspan>📗 الثيم الرابع · <span class=\"en\">Theme 4 – Travel and Transport<\u002Fspan> (جديد)<\u002Fh3>\n    <p class=\"sub\">الطيران والوقود الحيوي، الازدحام، السلامة على الطرق، وظائف المطارات، وقطار عُمان. القاعدة: المضارع التام والمضارع التام المستمر.<\u002Fp>\n    <div class=\"ggrid\">\n      <a class=\"shell gtile maptile\" href=\"T4Book.dc.html\"><div class=\"core pad\"><div class=\"ic\">📘<\u002Fdiv><h4>شرح الثيم 4<\u002Fh4><p>الوحدات الخمس وإسبانيا وقطار الماغليف والمراجعة، مع إجابات كتاب النشاط وملحقاته.<\u002Fp><\u002Fdiv><\u002Fa>\n      <a class=\"shell gtile maptile\" href=\"T4Vocab.dc.html\"><div class=\"core pad\"><div class=\"ic\">🔤<\u002Fdiv><h4>كلمات وألعاب الثيم 4<\u002Fh4><p>كلمات كل وحدة بمعانيها، 15 لعبة حفظ، وأسئلة وزارية مع تعليل كل إجابة.<\u002Fp><\u002Fdiv><\u002Fa>\n      <a class=\"shell gtile maptile\" href=\"T4Grammar.dc.html\"><div class=\"core pad\"><div class=\"ic\">🧩<\u002Fdiv><h4>قواعد الثيم 4<\u002Fh4><p>9 دروس: المضارع التام والمستمر، for/since، الأخطاء المشهورة، وصف الاتجاهات، الضمائر، وأدوات الربط.<\u002Fp><\u002Fdiv><\u002Fa>\n      <a class=\"shell gtile maptile\" href=\"T4Writing.dc.html\"><div class=\"core pad\"><div class=\"ic\">📝<\u002Fdiv><h4>كتابة الثيم 4<\u002Fh4><p>قالب المقال المعلوماتي و5 مقالات جاهزة بالترجمة وقائمة الكلمات.<\u002Fp><\u002Fdiv><\u002Fa>\n      <a class=\"shell gtile maptile\" href=\"T4Exam.dc.html\"><div class=\"core pad\"><div class=\"ic\">🏆<\u002Fdiv><h4>اختبارات الثيم 4<\u002Fh4><p>قراءة، قواعد، مفردات، استماع بصوت، كتابة مع مصحّح للمقال المعلوماتي، ونمط وزاري.<\u002Fp><\u002Fdiv><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <h2 class=\"sec\">أقسام الثيم الأول<\u002Fh2>\n  <div class=\"ggrid\">\n    <a class=\"shell gtile maptile\" href=\"Book.dc.html\"><div class=\"core pad\"><div class=\"ic\">📘<\u002Fdiv><h4>شرح الكتاب<\u002Fh4><p>كل وحدة صفحة بصفحة، مع إجابات الأنشطة، وزر لإخفاء الإجابات.<\u002Fp><\u002Fdiv><\u002Fa>\n    <a class=\"shell gtile maptile\" href=\"Vocab.dc.html\"><div class=\"core pad\"><div class=\"ic\">🔤<\u002Fdiv><h4>الكلمات والألعاب<\u002Fh4><p>اختر الوحدة: كلماتها بالمعنى والمثال، 15 لعبة لحفظها (بطاقات، توصيل، ذاكرة، خمّن الكلمة…)، وأسئلة وزارية عليها.<\u002Fp><\u002Fdiv><\u002Fa>\n    <a class=\"shell gtile maptile\" href=\"Games.dc.html\"><div class=\"core pad\"><div class=\"ic\">🎮<\u002Fdiv><h4>تحديات المهارات (15 تحدٍّ)<\u002Fh4><p>ابنِ الجملة، صيّاد الأخطاء، اسمع واكتب، القراءة السريعة، طبيب الإعلانات، تحدي 60 ثانية، من سيربح المليون… وكل خطأ معه شرح.<\u002Fp><\u002Fdiv><\u002Fa>\n    <a class=\"shell gtile maptile\" href=\"Grammar.dc.html\"><div class=\"core pad\"><div class=\"ic\">🧩<\u002Fdiv><h4>القواعد<\u002Fh4><p>10 دروس مبسطة، وتحت كل شرح أسئلة «تأكد من فهمك» تشرح لك خطأك (50 سؤالًا).<\u002Fp><\u002Fdiv><\u002Fa>\n    <a class=\"shell gtile maptile\" href=\"Writing.dc.html\"><div class=\"core pad\"><div class=\"ic\">📝<\u002Fdiv><h4>الكتابة<\u002Fh4><p>عبارات جاهزة بمعانيها، قوالب تملؤها، و8 مقالات جاهزة بكلمات سهلة مع الترجمة وقائمة كلمات كل مقال.<\u002Fp><\u002Fdiv><\u002Fa>\n    <a class=\"shell gtile maptile\" href=\"Exam.dc.html\"><div class=\"core pad\"><div class=\"ic\">🏆<\u002Fdiv><h4>الاختبارات<\u002Fh4><p>قراءة بنصوص جديدة، قواعد، مفردات، استماع بصوت، وكتابة مع مصحّح تلقائي، ونمط وزاري.<\u002Fp><\u002Fdiv><\u002Fa>\n  <\u002Fdiv>\n\n  <section class=\"block\">\n    <h3><span class=\"dot\"><\u002Fspan>نصائح للاختبار الوزاري<\u002Fh3>\n    <div class=\"bi\">\n      <div><h4>قطعة المفردات<\u002Fh4><p>اقرأ الجملة كاملة قبل الفراغ وبعده. حدّد نوع الكلمة المطلوبة: اسم بعد <span class=\"en\">a / the / his<\u002Fspan>، فعل بعد <span class=\"en\">to<\u002Fspan>، صفة قبل اسم.<\u002Fp><\u002Fdiv>\n      <div><h4>المبني للمجهول<\u002Fh4><p>إذا رأيت <span class=\"en\">by + الفاعل<\u002Fspan> أو كان الشيء لا يفعل الفعل بنفسه، فالجواب غالبًا <span class=\"en\">was / were + V3<\u002Fspan>.<\u002Fp><\u002Fdiv>\n      <div><h4>القراءة<\u002Fh4><p>اقرأ النص بسرعة أولًا (<span class=\"en\">skimming<\u002Fspan>) لتعرف الفكرة العامة، ثم ابحث عن الجملة الرئيسية في أول كل فقرة.<\u002Fp><\u002Fdiv>\n      <div><h4>الكتابة<\u002Fh4><p>التزم بالخطة: مقدمة، 3 فقرات بأمثلة، خاتمة. اكتب 100 كلمة على الأقل وراجع الإملاء.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <p class=\"foot\">الصف الثاني عشر · <span class=\"en\">Class Book 12A · Theme 1 – Retail Therapy<\u002Fspan><\u002Fp>\n<\u002Fmain>\n<sc-if value=\"{{pop.show}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"wpop\" role=\"dialog\" aria-label=\"ترجمة الكلمة\">\n    <button class=\"spk\" sc-camel-on-click=\"{{pop.say}}\" aria-label=\"استمع\">🔊<\u002Fbutton>\n    <div class=\"wtxt\"><b>{{pop.w}}<\u002Fb><span>{{pop.ar}}<\u002Fspan><small>{{pop.note}}<\u002Fsmall><\u002Fdiv>\n    <button class=\"x\" sc-camel-on-click=\"{{pop.close}}\" aria-label=\"إغلاق\">✕<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:2300}}\">\nclass Component extends DCLogic {\n  renderVals() { return {}; }\n}\nconst TAPM = {\n  say(t, rate){ try{ const u = new SpeechSynthesisUtterance(t); u.lang=\"en-GB\"; u.rate = rate || .85; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);}catch(e){} },\n  look(w){ const D = window.T1DICT || {}; const k = w.toLowerCase(); const c = [k, k.replace(/'s$/,\"\"), k.replace(/s'$/,\"s\"), k.replace(/ies$/,\"y\"), k.replace(/es$/,\"\"), k.replace(/s$/,\"\"), k.replace(/ied$/,\"y\"), k.replace(/([a-z])\\1ed$/,\"$1\"), k.replace(/ed$/,\"\"), k.replace(/d$/,\"\"), k.replace(/([a-z])\\1ing$/,\"$1\"), k.replace(/ing$/,\"e\"), k.replace(/ing$/,\"\"), k.replace(/ily$/,\"y\"), k.replace(/ly$/,\"\"), k.replace(/er$/,\"\"), k.replace(/est$/,\"\")]; for (const x of c) if (D[x]) return { base:x, ar:D[x] }; return null; },\n  tapWord(e){ try{\n    const tg = e.target; if (!tg || (tg.closest && tg.closest(\"button,a,input,textarea,select,label,.wpop\"))) return;\n    let r = null; const x = e.clientX, y = e.clientY;\n    if (document.caretRangeFromPoint) r = document.caretRangeFromPoint(x, y);\n    else if (document.caretPositionFromPoint) { const p = document.caretPositionFromPoint(x, y); if (p) { r = document.createRange(); r.setStart(p.offsetNode, p.offset); } }\n    if (!r || !r.startContainer || r.startContainer.nodeType !== 3) return;\n    const s = r.startContainer.textContent; let a = r.startOffset, b = r.startOffset; const re = /[A-Za-z'\\-]/;\n    while (a > 0 && re.test(s[a-1])) a--; while (b < s.length && re.test(s[b])) b++;\n    const w = s.slice(a, b).replace(/^[-']+|[-']+$/g, \"\"); if (!w || !/[A-Za-z]/.test(w)) return;\n    const f = this.look(w); this.say(w);\n    this.setState({ pop: { w, ar: f ? f.ar : \"اضغط 🔊 لتسمعها مرة أخرى\", note: f && f.base !== w.toLowerCase() ? \"من الكلمة: \" + f.base : \"\" } });\n  }catch(err){} },\n  popVals(){ const p = this.state && this.state.pop; return p ? { show:true, w:p.w, ar:p.ar, note:p.note, say: () => this.say(p.w), close: () => this.setState({ pop:null }) } : { show:false }; }\n};\nObject.assign(Component.prototype, TAPM);\nconst _rv = Component.prototype.renderVals;\nComponent.prototype.renderVals = function(){ const v = _rv.call(this) || {}; v.pop = this.popVals(); v.tapWord = (e) => this.tapWord(e); return v; };\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
